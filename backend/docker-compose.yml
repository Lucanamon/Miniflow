version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: miniflow-postgres
    restart: always
    environment:
      POSTGRES_USER: miniflow
      POSTGRES_PASSWORD: miniflowpass
      POSTGRES_DB: miniflowdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
