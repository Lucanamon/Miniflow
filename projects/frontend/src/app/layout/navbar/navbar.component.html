<header class="banner">
  <div class="banner-content">
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Forest Tree -->
          <path d="M16 4L12 10H14L11 16H13L9 22H23L19 16H21L18 10H20L16 4Z" fill="#2d5a2d"/>
          <path d="M16 4L12 10H14L11 16H13L9 22H23L19 16H21L18 10H20L16 4Z" fill="url(#forestGrad)" opacity="0.8"/>
          <!-- River Waves -->
          <path d="M4 24C5 23 7 22 9 23C11 24 13 23 15 24C17 25 19 24 21 23C23 22 25 23 28 24" stroke="#2a6fa5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M2 28C3 27 5 26 7 27C9 28 11 27 13 28C15 29 17 28 19 27C21 26 23 27 26 28" stroke="#3a8bc8" stroke-width="2" fill="none" stroke-linecap="round"/>
          <defs>
            <linearGradient id="forestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#2d5a2d;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#5a8f5a;stop-opacity:1" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <a routerLink="/sky" class="logo-text-link">
        <h1 class="logo-text">{{ title }}</h1>
      </a>
    </div>

    <!-- Navigation Items -->
    <nav class="main-nav">
      <a routerLink="/sky" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14.5 8.5L21 9L16 13.5L17.5 20L12 16.5L6.5 20L8 13.5L3 9L9.5 8.5L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>Sky</span>
      </a>
      <a routerLink="/constellations" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="18" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="6" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 6L16 6M8 18L16 18M6 8L6 16M18 8L18 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Constellations</span>
      </a>
      <a routerLink="/today" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Today</span>
      </a>
      <a routerLink="/reflection" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Reflection</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
</header>
