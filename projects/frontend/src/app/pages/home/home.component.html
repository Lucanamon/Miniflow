<div class="app-container">
  <!-- Banner/Header -->
  <header class="banner">
    <div class="banner-content">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Starry Sky dots -->
            <circle cx="6" cy="8" r="0.8" fill="#9de0ff" opacity="0.9"/>
            <circle cx="26" cy="10" r="0.6" fill="#9de0ff" opacity="0.7"/>
            <circle cx="8" cy="24" r="0.5" fill="#9de0ff" opacity="0.6"/>
            <circle cx="24" cy="22" r="0.7" fill="#9de0ff" opacity="0.8"/>
            <circle cx="16" cy="4" r="0.4" fill="#f4d03f" opacity="0.9"/>
            <!-- Orbit Trio circles -->
            <circle cx="16" cy="16" r="12" stroke="#5ac8f0" stroke-width="0.8" fill="none" opacity="0.6"/>
            <circle cx="16" cy="16" r="8" stroke="#a78bfa" stroke-width="0.6" fill="none" opacity="0.5"/>
            <circle cx="16" cy="16" r="4" stroke="#7dd3fc" stroke-width="0.5" fill="none" opacity="0.7"/>
            <!-- Central star -->
            <path d="M16 8L17.5 13L23 13L18.5 16L20 21L16 18L12 21L13.5 16L9 13L14.5 13L16 8Z" fill="url(#logoStarGradHome)" stroke="#7dd3fc" stroke-width="0.5" stroke-linejoin="round" opacity="0.95"/>
            <defs>
              <linearGradient id="logoStarGradHome" x1="16" y1="8" x2="16" y2="21">
                <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:0.9" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="logo-text">{{ title }}</h1>
      </div>
      <a routerLink="/notepad" class="nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 12h6M9 16h6M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Notepad
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <section class="content-section">
      <h2 style="margin-bottom: var(--spacing-md); color: var(--forest-dark); font-size: 1.875rem; font-weight: 700;">
        Miniflow
      </h2>
      <p style="margin-bottom: var(--spacing-lg); color: var(--gray-600); font-size: 1.125rem; line-height: 1.75;">
        Welcome to Miniflow :D This is your Eldritch Notebook. Terror for those who dare to explore!
      </p>
      
      <!-- Button Examples -->
      <div style="display: flex; flex-wrap: wrap; gap: var(--spacing-md); margin-top: var(--spacing-xl);">
        <app-button variant="primary" size="md">
          Primary Button
        </app-button>
        
        <app-button variant="secondary" size="md">
          Secondary Button
        </app-button>
        
        <app-button variant="outline" size="md">
          Outline Button
        </app-button>
      </div>
    </section>

    <!-- Additional Content Section for Future Use -->
    <section class="content-section" style="opacity: 0.6;">
      <h3 style="margin-bottom: var(--spacing-sm); color: var(--gray-700); font-size: 1.25rem; font-weight: 600;">
        Space for Future Content
      </h3>
      <p style="color: var(--gray-500); font-size: 0.875rem;">
        This section is reserved for future features and environment configurations.
      </p>
    </section>
  </main>
</div>
