<div class="reflection-preview-card">
  <h3 class="card-title">Last Reflection</h3>
  @if (reflection(); as entry) {
    <blockquote class="reflection-note">"{{ entry.note }}"</blockquote>
    <div class="reflection-meta">
      <span class="reflection-mood">
        Mood: {{ entry.mood }} {{ getMoodEmoji(entry.mood) }}
      </span>
      <span class="reflection-date">{{ formattedDate() }}</span>
    </div>
  }
</div>
