<div class="timezone-reader">
  <h3 class="chart-title">Worldwide clock and timezone</h3>
  <div class="timezone-grid">
    @for (tz of timezones(); track tz.city) {
      <div class="timezone-item">
        <div class="timezone-city">{{ tz.city }}</div>
        <div class="timezone-time">{{ tz.time }}</div>
        <div class="timezone-date">{{ tz.date }}</div>
        <div class="timezone-offset">{{ tz.offset }}</div>
      </div>
    }
  </div>
</div>
