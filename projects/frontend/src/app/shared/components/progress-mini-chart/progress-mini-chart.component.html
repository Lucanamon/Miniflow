<div class="progress-mini-chart">
  <h3 class="chart-title">Weekly Progress</h3>
  <p class="chart-subtitle">Tasks completed per day (last 7 days)</p>
  <div class="chart-bars">
    @for (day of progressData(); track day.date) {
      <div class="bar-group">
        <div
          class="bar"
          [style.height.%]="(day.completed / maxCompleted()) * 100"
          [attr.aria-label]="day.label + ': ' + day.completed + ' tasks'"
        ></div>
        <span class="bar-label">{{ day.label }}</span>
      </div>
    }
  </div>
</div>
