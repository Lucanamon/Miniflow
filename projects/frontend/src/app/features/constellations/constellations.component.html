<div class="constellations-page">
  <!-- Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Constellations</h1>
      <p class="page-subtitle">Your boards and workspaces</p>
    </div>
    <app-button variant="primary" size="md" (click)="showCreateModal.set(true)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      New Board
    </app-button>
  </div>

  <!-- Boards Grid -->
  <div class="boards-grid">
    @for (board of boards(); track board.id) {
      <app-card [title]="board.name" [subtitle]="board.description" variant="default" [hoverable]="true" [class]="'board-' + board.color">
        <div class="board-content">
          <div class="board-actions">
            <button class="icon-btn" (click)="editBoard(board)" title="Edit board">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 4H4C3.46957 4 2.96086 4.21071 2.58579 4.58579C2.21071 4.96086 2 5.46957 2 6V20C2 20.5304 2.21071 21.0391 2.58579 21.4142C2.96086 21.7893 3.46957 22 4 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18.5 2.5C18.8978 2.10218 19.4374 1.87868 20 1.87868C20.5626 1.87868 21.1022 2.10218 21.5 2.5C21.8978 2.89782 22.1213 3.43739 22.1213 4C22.1213 4.56261 21.8978 5.10218 21.5 5.5L12 15L8 16L9 12L18.5 2.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="icon-btn delete-btn" (click)="deleteBoard(board.id)" title="Delete board">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="board-stats">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L14.5 8.5L21 9L16 13.5L17.5 20L12 16.5L6.5 20L8 13.5L3 9L9.5 8.5L12 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
            </svg>
            <span>{{ board.taskCount }} tasks</span>
          </div>
        </div>
      </app-card>
    } @empty {
      <div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="18" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="6" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 6L16 6M8 18L16 18M6 8L6 16M18 8L18 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p class="empty-title">No boards yet. Create your first constellation!</p>
        <p class="empty-encouragement">{{ emptyStateMessage() }}</p>
        <app-button variant="primary" size="md" (click)="showCreateModal.set(true)">
          Create Board
        </app-button>
      </div>
    }
  </div>

  <!-- Create Board Modal -->
  @if (showCreateModal()) {
    <div class="modal-overlay" (click)="showCreateModal.set(false)">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h2>Create New Board</h2>
          <button class="close-btn" (click)="showCreateModal.set(false)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Board Name</label>
            <input
              type="text"
              class="form-input"
              [value]="newBoardName()"
              (input)="newBoardName.set($any($event.target).value)"
              placeholder="e.g., Work Projects"
              autofocus
            />
          </div>
          <div class="form-group">
            <label>Description (Optional)</label>
            <textarea
              class="form-input"
              [value]="newBoardDescription()"
              (input)="newBoardDescription.set($any($event.target).value)"
              placeholder="What is this board for?"
              rows="3"
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <app-button variant="outline" size="md" (click)="showCreateModal.set(false)">
            Cancel
          </app-button>
          <app-button variant="primary" size="md" (click)="createBoard()">
            Create Board
          </app-button>
        </div>
      </div>
    </div>
  }
</div>
