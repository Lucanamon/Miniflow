<div class="app-container">
  <!-- Banner/Header -->
  <header class="banner">
    <div class="banner-content">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Forest Tree -->
            <path d="M16 4L12 10H14L11 16H13L9 22H23L19 16H21L18 10H20L16 4Z" fill="#2d5a2d"/>
            <path d="M16 4L12 10H14L11 16H13L9 22H23L19 16H21L18 10H20L16 4Z" fill="url(#forestGrad)" opacity="0.8"/>
            <!-- River Waves -->
            <path d="M4 24C5 23 7 22 9 23C11 24 13 23 15 24C17 25 19 24 21 23C23 22 25 23 28 24" stroke="#2a6fa5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M2 28C3 27 5 26 7 27C9 28 11 27 13 28C15 29 17 28 19 27C21 26 23 27 26 28" stroke="#3a8bc8" stroke-width="2" fill="none" stroke-linecap="round"/>
            <defs>
              <linearGradient id="forestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#2d5a2d;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#5a8f5a;stop-opacity:1" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="logo-text">{{ title }}</h1>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <section class="content-section">
      <h2 style="margin-bottom: var(--spacing-md); color: var(--forest-dark); font-size: 1.875rem; font-weight: 700;">
        Miniflow
      </h2>
      <p style="margin-bottom: var(--spacing-lg); color: var(--gray-600); font-size: 1.125rem; line-height: 1.75;">
        Welcome to Miniflow :D This is your Eldritch Notebook. Terror for those who dare to explore! (...)
      </p>
      
      <!-- Button Examples -->
      <div style="display: flex; flex-wrap: wrap; gap: var(--spacing-md); margin-top: var(--spacing-xl);">
        <app-button variant="primary" size="md">
          Primary Button
        </app-button>
        
        <app-button variant="secondary" size="md">
          Secondary Button
        </app-button>
        
        <app-button variant="outline" size="md">
          Outline Button
        </app-button>
      </div>
    </section>

    <!-- Additional Content Section for Future Use -->
    <section class="content-section" style="opacity: 0.6;">
      <h3 style="margin-bottom: var(--spacing-sm); color: var(--gray-700); font-size: 1.25rem; font-weight: 600;">
        Space for Future Content
      </h3>
      <p style="color: var(--gray-500); font-size: 0.875rem;">
        This section is reserved for future features and environment configurations.
      </p>
    </section>
  </main>

  <!-- Router Outlet for Future Routes -->
  <router-outlet />
</div>
