<div class="sky-page">
  @if (isLoggedIn) {
    <!-- Constellation Mind Map - Living navigation -->
    <section class="constellation-section">
      <app-constellation-map />
    </section>
  }

  <!-- Quote of the day - always visible -->
  <section class="dashboard-section">
    <app-encouragement-banner context="dashboard" />
  </section>

  @if (isLoggedIn) {
    <!-- Date/Time Picker for Add Task -->
    @if (showDateTimePicker()) {
      <section class="date-time-picker-section">
        <app-card title="Set date &amp; time" variant="default">
          <div class="task-picker-fields">
            <label class="task-picker-label">
              <span>Date</span>
              <input type="date" [ngModel]="taskDraftDate()" (ngModelChange)="taskDraftDate.set($event)" class="task-picker-input" />
            </label>
            <label class="task-picker-label">
              <span>Time</span>
              <input type="time" [ngModel]="taskDraftTime()" (ngModelChange)="taskDraftTime.set($event)" class="task-picker-input" />
            </label>
          </div>
          <div class="task-picker-actions">
            <app-button variant="outline" size="md" (click)="closeDateTimePicker()">Cancel</app-button>
            <app-button variant="primary" size="md" (click)="confirmAddTask()">Add task</app-button>
          </div>
        </app-card>
      </section>
    }

    <!-- Quick Actions -->
    <section class="quick-actions-section">
      <app-card title="Quick Actions" variant="highlight">
        <div class="quick-task-form">
          <input
            type="text"
            class="task-input"
            [value]="quickTaskTitle()"
            (input)="quickTaskTitle.set($any($event.target).value)"
            (keyup.enter)="createQuickTask()"
            placeholder="Create a new task..."
          />
          <app-button variant="primary" size="md" (click)="createQuickTask()">
            Add Task
          </app-button>
        </div>
        <div class="action-buttons">
          <app-button variant="secondary" size="md" (click)="goToToday()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="6" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="18" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="6" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 6L16 6M8 18L16 18M6 8L6 16M18 8L18 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            View Boards
          </app-button>
          <app-button variant="outline" size="md" (click)="goToFocusMode()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
              <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Focus Mode
          </app-button>
        </div>
      </app-card>
    </section>

    <!-- Status Cards Grid -->
    <div class="status-grid">
      <app-card title="Daily Sky Status" variant="default" [hoverable]="true">
        <div class="card-stat">
          <div class="stat-value">{{ tasksCompletedToday() }}</div>
          <div class="stat-label">Tasks completed today</div>
        </div>
      </app-card>
      <app-card title="Current Orbit" variant="default" [hoverable]="true">
        <div class="card-stat">
          <div class="stat-value">{{ tasksInProgress() }}</div>
          <div class="stat-label">Tasks in progress</div>
        </div>
      </app-card>
      <app-card title="My Note" variant="default" [hoverable]="true">
        <div class="card-stat">
          <div class="stat-value">{{ totalBoards() }}</div>
          <div class="stat-label">Active boards</div>
        </div>
      </app-card>
    </div>

    <!-- Recent Activity (logged-in only) -->
    <div class="dashboard-cards-row">
      <app-card variant="default" [hoverable]="true">
        <app-recent-activity-card />
      </app-card>
    </div>
  }

  <!-- Worldwide clock and timezone - always visible -->
  <div class="dashboard-cards-row">
    <app-card variant="default" [hoverable]="true">
      <app-progress-mini-chart />
    </app-card>
  </div>

  @if (isLoggedIn) {
    <!-- Future Insight Module -->
    <section class="future-module-placeholder" aria-hidden="true">
    </section>
  }
</div>
