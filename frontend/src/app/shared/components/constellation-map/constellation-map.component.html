<div class="constellation-map" [style.--core-glow-intensity]="coreGlowIntensity">
  <!-- Dark galaxy disc behind constellation -->
  <div class="galaxy-disc" aria-hidden="true"></div>

  <!-- Optional background star dust -->
  @for (star of starDust; track star.id) {
    <div
      class="star-dust"
      [style.--star-x]="star.x + '%'"
      [style.--star-y]="star.y + '%'"
      [style.--star-delay]="star.delay + 's'"
      [style.--star-duration]="star.duration + 's'"
      aria-hidden="true"
    ></div>
  }

  <!-- Living Constellation Core -->
  <div class="constellation-core" aria-hidden="true">
    <div class="core-halo"></div>
    <div class="core-star"></div>
  </div>

  <!-- Connection lines -->
  @for (node of satelliteNodes; track node.label; let i = $index) {
    <div
      class="connection-line"
      [attr.data-node-index]="i"
      [style.--line-angle]="(node.angle + 180) + 'deg'"
      [style.--line-length]="orbitRadius"
    ></div>
  }

  <!-- Satellite nodes -->
  @for (node of satelliteNodes; track node.label; let i = $index) {
    <app-constellation-node
      [label]="node.label"
      [route]="node.route"
      [variant]="'default'"
      [angle]="node.angle"
      [distance]="orbitRadius"
      [accent]="node.accent"
      [nodeIndex]="i"
      [nodeTier]="node.tier"
    />
  }
</div>
