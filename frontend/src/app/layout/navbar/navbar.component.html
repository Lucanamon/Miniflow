<header class="banner">
  <div class="banner-content">
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Starry Sky dots -->
          <circle cx="6" cy="8" r="0.8" fill="#9de0ff" opacity="0.9"/>
          <circle cx="26" cy="10" r="0.6" fill="#9de0ff" opacity="0.7"/>
          <circle cx="8" cy="24" r="0.5" fill="#9de0ff" opacity="0.6"/>
          <circle cx="24" cy="22" r="0.7" fill="#9de0ff" opacity="0.8"/>
          <circle cx="16" cy="4" r="0.4" fill="#f4d03f" opacity="0.9"/>
          <!-- Orbit Trio circles -->
          <circle cx="16" cy="16" r="12" stroke="#5ac8f0" stroke-width="0.8" fill="none" opacity="0.6"/>
          <circle cx="16" cy="16" r="8" stroke="#a78bfa" stroke-width="0.6" fill="none" opacity="0.5"/>
          <circle cx="16" cy="16" r="4" stroke="#7dd3fc" stroke-width="0.5" fill="none" opacity="0.7"/>
          <!-- Central star -->
          <path d="M16 8L17.5 13L23 13L18.5 16L20 21L16 18L12 21L13.5 16L9 13L14.5 13L16 8Z" fill="url(#logoStarGrad)" stroke="#7dd3fc" stroke-width="0.5" stroke-linejoin="round" opacity="0.95"/>
          <defs>
            <linearGradient id="logoStarGrad" x1="16" y1="8" x2="16" y2="21">
              <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:0.9" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <a routerLink="/sky" class="logo-text-link">
        <h1 class="logo-text">{{ title }}</h1>
      </a>
      <span class="header-sep">|</span>
      @if (!isLoggedIn) {
        <a routerLink="/login" routerLinkActive="active" class="header-login-link">Login</a>
      } @else {
        <div class="nav-item user-pill">
          <span class="user-email">{{ userEmail }}</span>
          <button type="button" class="logout-button" (click)="logout()">Logout</button>
        </div>
      }
    </div>

    <!-- Navigation Items -->
    <nav class="main-nav">
      <a routerLink="/sky" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14.5 8.5L21 9L16 13.5L17.5 20L12 16.5L6.5 20L8 13.5L3 9L9.5 8.5L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>Sky</span>
      </a>
      <a routerLink="/constellations" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="18" cy="6" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="6" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 6L16 6M8 18L16 18M6 8L6 16M18 8L18 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>My Note</span>
      </a>
      <a routerLink="/today" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Today</span>
      </a>
      @if (isAdmin) {
        <a routerLink="/admin" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Admin</span>
        </a>
      }
      <a routerLink="/settings" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
</header>
